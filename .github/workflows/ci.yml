# Este es un flujo de trabajo básico para ayudarte a empezar con GitHub Actions.
# Define un flujo de trabajo llamado "CI" (Integración Continua).

name: CI

# Controla cuándo se ejecutará el flujo de trabajo.
# Se activa en eventos de push o pull request, pero solo para la rama "main".
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Un flujo de trabajo se compone de uno o más trabajos que pueden ejecutarse secuencialmente o en paralelo.
jobs:
  # Este flujo de trabajo contiene un único trabajo llamado "build".
  build:
    # El tipo de máquina en la que se ejecutará el trabajo.
    runs-on: ubuntu-latest

    # Los pasos representan una secuencia de tareas que se ejecutarán como parte del trabajo.
    steps:
      # 1. Descarga tu repositorio bajo $GITHUB_WORKSPACE, para que tu trabajo pueda acceder a él.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura el entorno de Python en la versión que necesites.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala Poetry, que se usa para gestionar las dependencias del proyecto.
      - name: Install Poetry
        uses: snok/install-poetry@v1

      # 4. Instala las dependencias del proyecto usando el archivo poetry.lock.
      - name: Install dependencies
        run: poetry install --no-interaction

      # 5. (Opcional) Ejecuta un linter para comprobar la calidad y el estilo del código.
      - name: Lint with ruff
        run: poetry run ruff check . --fix